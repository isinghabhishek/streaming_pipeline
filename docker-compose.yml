version: "3.9"

# =============================================================================
# Real-Time Streaming Pipeline — Docker Compose
# Usage: docker compose --env-file .env up --wait
# =============================================================================

x-common-env: &common-env
  env_file: .env

services:

  # ---------------------------------------------------------------------------
  # Kafka (KRaft mode — no Zookeeper)
  # ---------------------------------------------------------------------------
  kafka:
    image: bitnami/kafka:3.6
    <<: *common-env
    ports:
      - "9092:9092"
    environment:
      # KRaft settings
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      # Topic defaults
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_CFG_NUM_PARTITIONS: 3
      # DLQ retention: 72 hours
      KAFKA_CFG_LOG_RETENTION_MS: 259200000
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test:
        - CMD-SHELL
        - kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Confluent Schema Registry
  # ---------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    <<: *common-env
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:8081/subjects || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Schema Init — registers Avro schemas at startup
  # ---------------------------------------------------------------------------
  schema-init:
    image: python:3.11-slim
    <<: *common-env
    depends_on:
      schema-registry:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - ./schemas:/schemas:ro
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    command: >
      sh -c "pip install --quiet requests && python /scripts/register_schemas.py"
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Flink JobManager
  # ---------------------------------------------------------------------------
  flink-jobmanager:
    image: apache/flink:1.18-scala_2.12-java11
    <<: *common-env
    command: jobmanager
    ports:
      - "8082:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: ${FLINK_TASK_SLOTS:-2}
        state.backend: filesystem
        state.checkpoints.dir: file:///data/checkpoints
        execution.checkpointing.interval: ${CHECKPOINT_INTERVAL_MS:-10000}
    volumes:
      - flink_checkpoints:/data/checkpoints
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:8081/overview || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Flink TaskManager
  # ---------------------------------------------------------------------------
  flink-taskmanager:
    image: apache/flink:1.18-scala_2.12-java11
    <<: *common-env
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: ${FLINK_TASK_SLOTS:-2}
        state.backend: filesystem
        state.checkpoints.dir: file:///data/checkpoints
    volumes:
      - flink_checkpoints:/data/checkpoints

  # ---------------------------------------------------------------------------
  # Spark Thrift Server (Delta Lake queries)
  # ---------------------------------------------------------------------------
  spark-thrift:
    image: bitnami/spark:3.5
    <<: *common-env
    ports:
      - "10000:10000"
      - "4040:4040"
    environment:
      SPARK_MODE: master
      SPARK_MASTER_URL: local[*]
    command: >
      bash -c "
        pip install --quiet delta-spark==3.0.0 &&
        /opt/bitnami/spark/sbin/start-thriftserver.sh
          --master local[*]
          --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
          --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
          --conf spark.delta.logStore.class=org.apache.spark.sql.delta.storage.HDFSLogStore
          --hiveconf hive.server2.thrift.port=10000
          --hiveconf hive.server2.thrift.bind.host=0.0.0.0 &&
        tail -f /opt/bitnami/spark/logs/*.out
      "
    volumes:
      - delta_data:/data/delta
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z localhost 10000 || exit 1
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ---------------------------------------------------------------------------
  # dbt Runner (cron every 5 minutes)
  # ---------------------------------------------------------------------------
  dbt-runner:
    image: python:3.11-slim
    <<: *common-env
    depends_on:
      spark-thrift:
        condition: service_healthy
    volumes:
      - ./dbt:/dbt
    working_dir: /dbt
    environment:
      DBT_SPARK_HOST: ${DBT_SPARK_HOST:-spark-thrift}
      DBT_SPARK_PORT: ${DBT_SPARK_PORT:-10000}
      DBT_SCHEMA: ${DBT_SCHEMA:-pipeline_dbt}
    command: >
      bash -c "
        pip install --quiet dbt-core dbt-spark &&
        echo '${DBT_CRON_SCHEDULE:-*/5 * * * *} cd /dbt && dbt run && dbt test >> /var/log/dbt.log 2>&1' | crontab - &&
        cron -f
      "

  # ---------------------------------------------------------------------------
  # Grafana
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    <<: *common-env
    depends_on:
      spark-thrift:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-changeme}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:3000/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  kafka_data:
  flink_checkpoints:
  delta_data:
  grafana_data:
